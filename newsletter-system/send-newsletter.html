<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Send Newsletter | Ojasio</title>
  <link rel="stylesheet" href="ojasio-subscribe.css">
  <style>
    body { background-color: #faf8f4; margin: 0; padding: 40px 20px; font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; }
    .admin-container { background-color: #ffffff; padding: 40px; border-radius: 16px; border: 1px solid rgba(201,151,63,0.3); max-width: 600px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
    h1 { color: #1c1c1e; font-family: 'Cormorant Garamond', serif; font-size: 32px; margin-top: 0; }
    .form-group { margin-bottom: 24px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #1c1c1e; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
    #login-screen { text-align: center; }
    #admin-panel { display: none; }
    .report { margin-top: 24px; padding: 16px; border-radius: 8px; display: none; }
    .report.success { background-color: rgba(74, 124, 89, 0.1); color: #4a7c59; }
    .report.error { background-color: rgba(211, 47, 47, 0.1); color: #d32f2f; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div id="login-screen">
      <h1>Admin Access</h1>
      <div class="form-group">
        <input type="password" id="admin-pass" placeholder="Enter Admin Password">
      </div>
      <button class="ojasio-submit-btn" onclick="checkAuth()">Login</button>
      <div id="login-error" style="color: red; margin-top: 10px; display: none;">Incorrect password</div>
    </div>

    <div id="admin-panel">
      <h1>Send Article Notification</h1>
      <p style="color: #666; margin-bottom: 30px;">This will trigger individual emails to all active subscribers via EmailJS.</p>
      
      <div class="form-group">
        <label>Article Title (e.g. How to Lose Belly Fat After 35)</label>
        <input type="text" id="a-title" required>
      </div>
      <div class="form-group">
        <label>Article Summary Hook (3 sentences maximum)</label>
        <textarea id="a-summary" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label>Article URL (Full link)</label>
        <input type="url" id="a-url" required>
      </div>
      
      <button class="ojasio-submit-btn" id="send-btn" style="width: 100%;" onclick="sendBroadcast()">Send to All Subscribers</button>
      
      <div id="status-report" class="report"></div>
    </div>
  </div>

  <script src="ojasio-subscribe.js"></script>
  <script>
    function checkAuth() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'OjasioAdmin2026!') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    async function sendBroadcast() {
      const title = document.getElementById('a-title').value;
      const summary = document.getElementById('a-summary').value;
      const urlStr = document.getElementById('a-url').value;
      const btn = document.getElementById('send-btn');
      const report = document.getElementById('status-report');

      if(!title || !summary || !urlStr) {
        alert("Fill all fields");
        return;
      }

      btn.innerText = "Processing via Google Sheets API...";
      btn.disabled = true;

      try {
        const payload = {
          action: 'send_broadcast',
          articleTitle: title,
          articleSummary: summary,
          articleUrl: urlStr,
          emailjsServiceId: EMAILJS_CONFIG.serviceId,
          emailjsTemplateId: EMAILJS_CONFIG.articleTemplateId,
          emailjsPublicKey: EMAILJS_CONFIG.publicKey,
          emailjsPrivateKey: "YOUR_EMAILJS_PRIVATE_KEY_HERE" // Required for REST API
        };

        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        report.className = "report success";
        report.innerText = "Request sent to internal mailer. Subscribers will receive emails shortly.";
        report.style.display = "block";
      } catch (err) {
        report.className = "report error";
        report.innerText = "Failed to communicate with API.";
        report.style.display = "block";
      }

      btn.innerText = "Send to All Subscribers";
      btn.disabled = false;
    }
  </script>
</body>
</html>
